<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Motion Studio — Assets</title>
<style>
  :root{
    --bg:#0e0f12; --panel:#16181d; --line:#24262d; --text:#e7e9ee; --dim:#9aa0ab;
    --accent:#6ea8fe; --radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px}
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px}
  header .count{color:var(--dim);font-size:13px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:16px 28px 0}
  .tab{padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
    color:var(--dim);cursor:pointer;font-size:13px}
  .tab.active{color:var(--text);border-color:var(--accent)}
  main{padding:20px 28px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .card .name{font-weight:600;margin:0 0 4px}
  .card .kind{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .card .meta{color:var(--dim);font-size:12.5px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
  .card details{margin-top:8px}
  .card summary{color:var(--dim);cursor:pointer;font-size:12px}
  .card code{font-size:11.5px;color:var(--dim);word-break:break-all}
  .empty{color:var(--dim);padding:40px 0;text-align:center}
</style>
</head>
<body>
<header>
  <h1>3D Motion Studio</h1><span class="count" id="count">assets</span>
</header>
<div class="tabs" id="tabs"></div>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No assets yet.</div></main>
<script>
let DATA = {categories:{}, count:0}, active = "All";
async function load(){
  try{ DATA = await (await fetch("/api/assets")).json(); }
  catch(e){ DATA = {categories:{}, count:0}; }
  document.getElementById("count").textContent = DATA.count + " assets";
  renderTabs(); render();
}
function cats(){ return ["All", ...Object.keys(DATA.categories)]; }
function renderTabs(){
  const t = document.getElementById("tabs"); t.innerHTML = "";
  for(const c of cats()){
    const b = document.createElement("button");
    b.className = "tab" + (c===active?" active":""); b.textContent = c;
    b.onclick = ()=>{ active=c; renderTabs(); render(); }; t.appendChild(b);
  }
}
function render(){
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  let items = [];
  for(const [cat, list] of Object.entries(DATA.categories))
    if(active==="All" || active===cat) items = items.concat(list);
  document.getElementById("empty").hidden = items.length>0;
  for(const a of items){
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<div class="kind">${a.kind}</div>
      <p class="name">${esc(a.name)}</p>
      <div class="meta">
        ${a.creator?`<span>Creator · ${esc(a.creator)}</span>`:""}
        ${a.license?`<span>License · ${esc(a.license)}</span>`:""}
        ${a.format?`<span>Format · ${esc(a.format)}</span>`:""}
      </div>
      <details><summary>Details</summary><code>${esc(a.details?.localPath||"")}</code></details>`;
    grid.appendChild(el);
  }
}
function esc(s){ return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
load();
</script>
</body>
</html>
